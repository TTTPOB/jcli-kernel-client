name: Release & Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Python
        run: uv python install 3.13
      - name: Verify release tag
        run: |
          uv run --no-project --python 3.13 python -c "import os, runpy; version = runpy.run_path('jcli_kernel_client/__version__.py')['__version__']; assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag does not match package version'"
      - name: Build wheel and source distribution
        run: uv build
      - name: Publish to PyPI using trusted publishing
        run: uv publish --trusted-publishing always dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
