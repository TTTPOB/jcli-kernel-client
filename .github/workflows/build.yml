name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install default client and test dependencies
        run: uv sync
      - name: Test default client
        run: uv run python -m pytest jcli_kernel_client/tests -k "not set_variable_and_get_variable and not set_variables_on_execute"
      - name: Install optional object transfer
        run: uv sync --extra objects
      - name: Test object transfer
        run: uv run --extra objects python -m pytest jcli_kernel_client/tests/test_client.py -k "set_variable_and_get_variable or set_variables_on_execute"
      - name: Build distributions
        run: uv build
